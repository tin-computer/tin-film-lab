<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReadnType · read and understand · reading launch</title>
<style>
@font-face{font-family:Mono;src:url('../refs/fonts/RobotoMono-Regular.woff2')}
@font-face{font-family:Geist;src:url('../../locin-cli-launch/refs/fonts/geist-sans-regular.woff2');font-weight:400}
@font-face{font-family:Geist;src:url('../../locin-cli-launch/refs/fonts/geist-sans-bold.woff2');font-weight:700}
*{box-sizing:border-box;animation:none!important;transition:none!important}
html,body{margin:0;background:#17191c;overflow:hidden;font-family:Geist,sans-serif}
#stage{position:absolute;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;--bg:#17191c;--text:#d8d6cb;--sub:#5c5e62;--primary:#e2b714;--success:#4ade80}
canvas{position:absolute;inset:0;width:1600px;height:900px}
#reader,#quiz{position:absolute;left:236px;width:1128px;opacity:0;transform-origin:50% 50%}
#reader{top:202px}
.book-title{font-size:30px;color:#d8d6cb;margin:0 0 45px;letter-spacing:.01em}
.book-title small{font-size:23px;margin-left:32px;color:#aaa99e}
#words{font-family:Mono,monospace;font-size:64px;color:var(--sub)}
.words-wrapper{position:relative;display:flex;flex-wrap:wrap;align-content:flex-start;width:100%;padding-bottom:.5em}
.word{position:relative;line-height:1em;margin:.25em .3em;border-bottom:2px solid transparent}
.char{position:relative;color:var(--sub)}.char.correct{color:var(--text)}.char.incorrect{color:#ca4754}
.caret,.pace-caret{display:none}
#film-caret{position:absolute;width:4px;height:65px;background:var(--primary);pointer-events:none}
.hint{margin-top:36px;color:#e2b714;font:28px Mono}
#quiz{top:206px}
.quiz-heading{font-size:28px;color:#aaa99e;margin:0 0 24px}
.quiz-fieldset{min-width:0;margin:0;padding:0;border:0}
.quiz-question-text{width:100%;font-size:67px;line-height:1.16;color:var(--text);padding:0 0 34px;max-width:1070px}
.quiz-options{display:flex;flex-direction:column;gap:14px}
.quiz-option{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 28px;border:1px solid #3d3e40;border-radius:8px;color:#c1c0b6;font-size:40px}
.quiz-option--correct{border-color:var(--success);color:var(--success)}
.quiz-option input{position:absolute;opacity:0}.quiz-option-mark{opacity:0}.quiz-option--correct .quiz-option-mark{opacity:1}
.quiz-note{font-size:28px;color:#aaa99e;margin:22px 0 0}
</style>
<div id="stage">
  <canvas id="art" width="1600" height="900"></canvas>
  <section id="reader" aria-label="Example reading session">
    <p class="book-title">Alice’s Adventures in Wonderland <small>example session</small></p>
    <div id="words"></div><div id="film-caret"></div>
    <p class="hint">read by typing</p>
  </section>
  <section id="quiz" aria-label="Example comprehension question">
    <p class="quiz-heading">Check your understanding</p>
    <fieldset class="quiz-fieldset">
      <legend class="quiz-question-text">Who was Alice sitting beside?</legend>
      <div class="quiz-options">
        <label class="quiz-option"><input type="radio" name="answer" disabled>Her sister<span class="quiz-option-mark">✓</span></label>
        <label class="quiz-option"><input type="radio" name="answer" disabled>The White Rabbit<span class="quiz-option-mark"></span></label>
        <label class="quiz-option"><input type="radio" name="answer" disabled>The Queen<span class="quiz-option-mark"></span></label>
      </div>
    </fieldset>
    <p class="quiz-note">Example question based on the passage.</p>
  </section>
</div>
<script src="../../tin-launch/tools/lib/motion.js"></script>
<script src="../../../music/tools/music.js"></script>
<script src="../music-cut/cue.js"></script>
<script src="../refs/word-renderer.js"></script>
<script>
const {clamp,lerp,sp,P}=Motion,M=Music(CUE),T=(b,k=1)=>M.time(b,k);
const q=new URLSearchParams(location.search),W=+(q.get('w')||960),H=+(q.get('h')||540);
const stage=document.querySelector('#stage'),canvas=document.querySelector('#art'),g=canvas.getContext('2d');
const reader=document.querySelector('#reader'),quiz=document.querySelector('#quiz'),caret=document.querySelector('#film-caret');
const words=document.querySelector('#words'),answers=[...document.querySelectorAll('.quiz-option')];
const passage='Alice was beginning to get very tired of sitting by her sister on the bank,';
const tokens=passage.split(' '),view=mountWords(words,tokens,{flowScroll:true,smoothCaret:'off'});
const rabbit=new Image(),typewriter=new Image(),wippy=new Image();
rabbit.src='../refs/white-rabbit.jpg';typewriter.src='../refs/typewriter.jpg';
wippy.src='../refs/readntype-tin-character.svg';
const ready=Promise.all([document.fonts.load('64px Mono'),document.fonts.load('700 120px Geist'),document.fonts.load('40px Geist'),...[rabbit,typewriter,wippy].map(im=>new Promise((ok,no)=>{im.onload=ok;im.onerror=()=>no(new Error('Missing asset '+im.src))}))]);
const bg='#17191c',paper='#eee8dc',ink='#22221e',gold='#e2b714';
const cues={reader:T(3),quiz:T(6),answer:T(8),close:T(9)};
window.FILM={width:1600,height:900,duration:CUE.length,events:Object.entries(cues).map(([name,t])=>({name,t}))};
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}
function text(s,x,y,size=60,color=ink,font='Geist',weight=400){g.fillStyle=color;g.font=`${weight} ${size}px ${font}`;g.textBaseline='alphabetic';g.fillText(s,x,y)}
function photo(im,x,y,w,h,crop){const [sx,sy,sw,sh]=crop||[0,0,im.width,im.height];g.drawImage(im,sx,sy,sw,sh,x,y,w,h)}
function opening(t){
 rect(0,0,1600,900,paper);
 const p=P(t,0,T(3)),zoom=lerp(1.13,1,p);
 g.save();g.translate(420,410);g.rotate(-.05+.035*p);g.scale(zoom,zoom);
 g.globalCompositeOperation='multiply';photo(rabbit,-260,-390,530,810);g.restore();
 g.save();g.translate(760,395);g.rotate(-.025);text('Read',0,0,162,ink,'Georgia');text('by typing.',0,155,117,ink,'Geist',700);g.restore();
 // The archival typewriter is one brief material change, not a repeating background.
 if(t>=T(2)&&t<T(2,3)){
  const h=190*clamp(sp(t-T(2),'snappy'));g.save();g.beginPath();g.rect(0,710,1600,h);g.clip();
  photo(typewriter,0,640,1600,400,[0,typewriter.height*.48,typewriter.width,typewriter.height*.3]);g.restore();
 }
 text('ReadnType',105,102,36,ink,'Geist',700);
 const line=clamp(sp(t-T(1,3),'base'));rect(775,590,630*line,9,gold);
 const turn=P(t,T(3)-CUE.beat,CUE.beat);
 // One paper edge reveals the reading surface on the downbeat.
 if(turn>0){g.save();g.beginPath();g.moveTo(1600-1800*turn,0);g.lineTo(1600,0);g.lineTo(1600,900);g.lineTo(1760-1800*turn,900);g.closePath();g.fillStyle=bg;g.fill();g.restore()}
}
function setReading(t){
 const progress=clamp((t-cues.reader)/(cues.quiz-cues.reader-CUE.beat));
 const typed=Math.floor(passage.length*progress);let remaining=typed,active=0,offset=0;
 for(let i=0;i<tokens.length;i++){
  const n=clamp(remaining,0,tokens[i].length);view.renderWord(i,tokens[i].slice(0,n));
  if(remaining>=0){active=i;offset=n}remaining-=tokens[i].length+1;
 }
 // Film time drives the caret; the product's wall-clock caret animation is not used.
 const cell=words.querySelectorAll('.word')[active],chars=cell.children;
 const ch=chars[Math.min(offset,chars.length-1)];
 caret.style.left=`${words.offsetLeft+cell.offsetLeft+ch.offsetLeft+(offset===chars.length?ch.offsetWidth:0)}px`;
 caret.style.top=`${words.offsetTop+cell.offsetTop+ch.offsetTop-4}px`;
 return typed;
}
function closing(t){
 const p=clamp(sp(t-cues.close,'heavy'));
 rect(0,0,1600,900,gold);
 const fold=P(t,cues.close,CUE.beat*2);
 g.save();g.translate(795,485);g.rotate(-.025*p);
 rect(-625,-300,625,603,paper);rect(0,-300,625,603,'#fffaf0');
 rect(-4,-300,8,603,'#c8bba1');
 text('ALICE’S ADVENTURES',-562,-225,25,ink,'Mono');text('IN WONDERLAND',-562,-187,25,ink,'Mono');
 text('Her sister.',-562,-51,70,ink,'Geist',700);
 text('“sitting by her sister”',-562,29,25,ink,'Mono');
 text('Keep reading.',60,-163,66,ink,'Geist',700);
 g.save();g.beginPath();g.rect(0,-300,625,603);g.clip();g.translate(310,101+145*(1-p));g.rotate(-.06+.06*p);g.drawImage(wippy,-200,-220,400,400);g.restore();
 if(fold<1){rect(0,-300,625*(1-fold),603,gold)}
 g.restore();
 text('ReadnType',113,111,38,ink,'Geist',700);text('readntype.me',114,841,34,ink,'Mono');
}
function answerReveal(t){
 const p=clamp(sp(t-cues.answer,'heavy'));
 // The selected answer expands out of its option into the printed page.
 const x=lerp(236,0,p),y=lerp(384,0,p),w=lerp(1128,1600,p),h=lerp(92,900,p);
 g.save();g.beginPath();g.rect(x,y,w,h);g.clip();rect(0,0,1600,900,gold);
 g.globalAlpha=.2;g.globalCompositeOperation='multiply';photo(rabbit,1130,-45,640,975);g.globalAlpha=1;g.globalCompositeOperation='source-over';
 const size=lerp(40,187,p),tx=lerp(265,163,p),ty=lerp(444,491,p);
 text('Her sister',tx,ty,size,ink,'Geist',700);
 g.globalAlpha=P(t,cues.answer+.25,.3);text('“sitting by her sister”',168,626,42,ink,'Mono');
 g.strokeStyle=ink;g.lineWidth=7;g.beginPath();g.moveTo(171,312);g.lineTo(192,334);g.lineTo(236,279);g.stroke();g.restore();
}
window.seek=async function(t){
 await ready;t=clamp(t,0,CUE.length);const scale=Math.min(W/1600,H/900);
 stage.style.transform=`translate(${(W-1600*scale)/2}px,${(H-900*scale)/2}px) scale(${scale})`;
 canvas.style.zIndex=t>=cues.answer?'2':'0';
 g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;rect(0,0,1600,900,bg);
 reader.style.opacity=quiz.style.opacity='0';reader.style.transform=quiz.style.transform='none';
 answers.forEach((a,i)=>{
  const selected=i===0&&t>=cues.answer;
  a.classList.toggle('quiz-option--correct',selected);a.querySelector('input').checked=selected;
  a.style.visibility=selected?'hidden':'visible';
 });
 let phase='opening',typed=0;
 if(t<cues.reader){opening(t)}
 else if(t<cues.quiz){
  phase='reading';typed=setReading(t);reader.style.opacity='1';
  reader.style.transform=`translateY(${30*(1-clamp(sp(t-cues.reader,'heavy')))}px)`;
  text('ReadnType',105,102,36,'#d8d6cb','Geist',700);
 }else if(t<cues.close){
  phase=t>=cues.answer?'answer':'question';quiz.style.opacity='1';
  const entrance=clamp(sp(t-cues.quiz,'heavy'));quiz.style.transform=`translateY(${38*(1-entrance)}px)`;
  text('ReadnType',105,102,36,'#d8d6cb','Geist',700);
  if(t>=cues.answer){
   quiz.style.opacity=String(1-P(t,cues.answer,.17));answerReveal(t);
  }
 }else{phase='end';closing(t)}
 window.FRAME={phase,typed,answer:phase==='answer'?'Her sister':null,example:true};
};
window.seek(0);
</script>
</html>
